<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ReCoding">
  <rect width="128" height="128" rx="28" fill="#1a1a19"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" fill="none" stroke="rgba(255,255,255,0.10)"/>
  <!-- Waveform on the left: the source. Bars shrink toward the arrow, the way
       a transcode trades bits away. -->
  <g fill="#c3c2b7">
    <rect x="20" y="52" width="6" height="24" rx="3"/>
    <rect x="32" y="40" width="6" height="48" rx="3"/>
    <rect x="44" y="30" width="6" height="68" rx="3"/>
  </g>
  <!-- Arrow: the conversion itself. -->
  <path d="M58 64h22" stroke="#3987e5" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M74 54l12 10-12 10" stroke="#3987e5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Compact waveform on the right: the result. -->
  <g fill="#ffffff">
    <rect x="94" y="48" width="6" height="32" rx="3"/>
    <rect x="106" y="56" width="6" height="16" rx="3"/>
  </g>
</svg>
